<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaifly AI Chat - Concept Builder</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mina:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bs-primary: #10a37f;
            --bs-primary-hover: #0d8a6a;
            --bn-font: 'Hind Siliguri', 'Mina', sans-serif;
            --en-font: 'Inter', sans-serif;
        }

        body {
            font-family: var(--bn-font);
            background-color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Offcanvas Customization */
        .offcanvas {
            width: 280px !important;
            background-color: #f9f9f9;
            border-right: 1px solid #e5e5e5;
        }

        .history-item {
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            color: #333;
            text-decoration: none;
        }

        .history-item:hover {
            background-color: #ececec;
        }

        /* Main Layout */
        .main-content {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 160px;
            /* Space for input box */
        }

        /* Message Styling */
        .msg-wrapper {
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            gap: 15px;
        }

        .msg-ai {
            background-color: #f7f7f8;
        }

        .avatar-icon {
            width: 35px;
            height: 35px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: white;
            font-size: 1.1rem;
        }

        .bg-user {
            background-color: #5d5d5d;
        }

        .bg-ai {
            background-color: transparent;
        }

        .bg-ai img {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            object-fit: cover;
        }

        .msg-content {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #374151;
        }

        /* Input Area - Fixed Bottom */
        .input-area-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, white 20%);
            padding: 20px 15px 30px;
            z-index: 100;
        }

        .input-box {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
            padding: 8px 12px;
        }

        #chatInput {
            border: none;
            resize: none;
            max-height: 150px;
            padding: 8px;
            font-size: 1rem;
        }

        #chatInput:focus {
            box-shadow: none;
        }

        .send-btn-circle {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            background-color: var(--bs-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .send-btn-circle:disabled {
            opacity: 0.3;
        }

        /* Preview Area */
        .preview-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .preview-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        /* Welcome UI */
        .welcome-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            padding: 20px;
        }

        .suggestion-btn {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            text-align: left;
            padding: 12px 15px;
            transition: all 0.2s;
            height: 100%;
            width: 100%;
        }

        .suggestion-btn:hover {
            background: #f7f7f8;
        }

        /* Typing Animation */
        .typing-char {
            display: inline-block;
            opacity: 0;
            animation: charReveal 0.1s forwards linear;
        }

        @keyframes charReveal {
            to {
                opacity: 1;
            }
        }

        /* Highlights */
        .important-tag {
            background: #fff3cd;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #ffeeba;
        }

        .critical-tag {
            background: #f8d7da;
            color: #721c24;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #f5c6cb;
        }

        /* Mobile Adjustments */
        @media (max-width: 576px) {
            .msg-wrapper {
                padding: 15px 10px;
                gap: 10px;
            }

            .msg-content {
                font-size: 0.95rem;
            }

            .avatar-icon {
                width: 28px;
                height: 28px;
                font-size: 0.9rem;
            }

            .welcome-hero h2 {
                font-size: 1.5rem;
            }

            .input-area-fixed {
                padding: 10px 10px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar (Bootstrap Offcanvas) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title d-flex align-items-center gap-2">
                <img src="../Logo/ChatGPT Image Feb 18, 2026, 12_46_28 PM.png" width="25" alt="Logo">
                Shaifly AI
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <button
                class="btn btn-outline-dark w-100 mb-4 rounded-3 d-flex align-items-center justify-content-center gap-2"
                onclick="location.reload()">
                <i class="fas fa-plus small"></i> New Chat
            </button>
            <p class="text-muted small fw-bold mb-2">History</p>
            <div id="historyList" class="d-flex flex-column gap-1">
                <!-- History populate -->
            </div>

            <div class="mt-auto pt-3 border-top">
                <button class="btn btn-light w-100 text-start d-flex align-items-center gap-2" onclick="manageApiKey()">
                    <i class="fas fa-cog"></i> API Configuration
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-light bg-white border-bottom px-3 sticky-top">
            <div class="container-fluid p-0">
                <button class="btn border-0 p-0 me-3" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#sidebarMenu">
                    <i class="fas fa-bars fa-lg"></i>
                </button>
                <div class="navbar-brand m-0 fw-bold d-flex align-items-center gap-2">
                    <img src="../Logo/shaifly_ai_avatar.png" width="35" class="rounded-circle" alt="Logo">
                    Shaifly AI
                </div>
                <a href="../index.html" class="btn btn-sm btn-dark rounded-pill px-3 ms-auto">Exit</a>
            </div>
        </nav>

        <!-- Chat Display -->
        <div id="chatBody" class="chat-container">
            <div id="welcomeScreen" class="welcome-hero">
                <img src="../Logo/shaifly_ai_avatar.png" width="80" class="mb-3 rounded-circle" alt="Logo">
                <h2 class="fw-bold px-3">আমি কীভাবে আপনাকে সাহায্য করতে পারি?</h2>
                <div class="container mt-4" style="max-width: 650px;">
                    <div class="row g-3">
                        <div class="col-6 col-sm-6">
                            <button class="suggestion-btn" onclick="autoInput('পরমাণুর গঠন সম্পর্কে জানতে চাই')">
                                <span class="fw-bold small">Chemistry</span>
                                <p class="m-0 small text-muted text-truncate">পরমাণুর গঠন ও ইলেকট্রন বিন্যাস সম্পর্কে
                                    জানুন।</p>
                            </button>
                        </div>
                        <div class="col-6 col-sm-6">
                            <button class="suggestion-btn" onclick="autoInput('কোষ বিভাজন সম্পর্কে জানতে চাই')">
                                <span class="fw-bold small">Biology</span>
                                <p class="m-0 small text-muted text-truncate">মাইটোসিস ও মিয়োসিস প্রক্রিয়া সম্পর্কে
                                    জানুন।</p>
                            </button>
                        </div>
                        <div class="col-6 col-sm-6">
                            <button class="suggestion-btn" onclick="autoInput('বলের সূত্র সম্পর্কে জানতে চাই')">
                                <span class="fw-bold small">Physics</span>
                                <p class="m-0 small text-muted text-truncate">নিউটনের গতি ও মহাকর্ষ সূত্র সম্পর্কে
                                    জানুন।</p>
                            </button>
                        </div>
                        <div class="col-6 col-sm-6">
                            <button class="suggestion-btn" onclick="autoInput('হাতে লেখা নোট বিশ্লেষণ')">
                                <span class="fw-bold small">Analysis</span>
                                <p class="m-0 small text-muted text-truncate">বইয়ের ছবি থেকে নোট তৈরি করুন।</p>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sticky Input Box -->
        <div class="input-area-fixed">
            <div class="input-box container-fluid">
                <div id="previewPane" class="preview-scroll mb-2" style="display: none;"></div>
                <div class="d-flex align-items-end gap-2">
                    <input type="file" id="imageUpload" accept="image/*" multiple style="display: none;">
                    <button class="btn p-1 text-muted" onclick="document.getElementById('imageUpload').click()"
                        title="Upload Image">
                        <i class="fas fa-camera fa-lg"></i>
                    </button>
                    <textarea id="chatInput" class="form-control" placeholder="একটি মেসেজ লিখুন..." rows="1"></textarea>
                    <button id="sendBtn" class="btn send-btn-circle border-0" disabled>
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </div>
            <div class="text-center mt-2">
                <small class="text-muted" style="font-size: 0.7rem;">Shaifly AI ভুল তথ্য দিতে পারে। গুরুত্বপূর্ণ তথ্য
                    যাচাই করে নিন।</small>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Config & Groq logic integration -->
    <script src="../js/config.js"></script>

    <script>
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBody = document.getElementById('chatBody');
        const imageUpload = document.getElementById('imageUpload');
        const previewPane = document.getElementById('previewPane');

        let selectedImages = [];
        let chatHistory = [{
            role: "system",
            content: `You are Shaifly AI, a highly intelligent and friendly educational assistant specifically designed for Bangladeshi SSC and HSC students. Your expertise covers Physics, Chemistry, Biology, Higher Math, and General Science according to the NCTB curriculum.

            Guidelines for Communication:
            1. Language: Always communicate in a polite, standard, and easy-to-understand Bengali (প্রমিত বাংলা). Use English scientific terms in brackets if necessary for clarity.
            2. Structured Content: Provide answers in a structured format:
               - [Executive Summary]: A quick 2-3 sentence overview.
               - [Key Breakdown]: Use bullet points to explain complex concepts.
               - [Exam Insights]: Specific tips for board exams.
            3. Tags: 
               - Use [IMPORTANT] at the beginning of lines that are key concepts.
               - Use [CRITICAL] for information that is must-know for exams.
            4. Image Analysis: If the user uploads a book page or handwritten note image, analyze the visible text/diagrams carefully and convert them into organized study notes.
            5. Personality: Be encouraging and helpful. If a concept is hard, simplify it using daily-life examples familiar to Bangladeshi students (e.g., using a rickshaw to explain Newton's laws).
            6. Accuracy: Prioritize data accuracy and logical reasoning above all else.`
        }];

        // Auto-resize input
        chatInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            sendBtn.disabled = this.value.trim() === "" && selectedImages.length === 0;
        });

        function autoInput(text) {
            chatInput.value = text;
            chatInput.dispatchEvent(new Event('input'));
        }

        // Image Handling
        imageUpload.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    selectedImages.push(ev.target.result);
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            });
            sendBtn.disabled = false;
        });

        function renderPreviews() {
            previewPane.style.display = selectedImages.length > 0 ? 'flex' : 'none';
            previewPane.innerHTML = '';
            selectedImages.forEach((src, i) => {
                const div = document.createElement('div');
                div.className = 'position-relative';
                div.innerHTML = `<img src="${src}" class="preview-thumb"><button class="btn btn-danger btn-sm rounded-circle position-absolute top-0 start-100 translate-middle p-0" style="width:18px;height:18px;font-size:10px;" onclick="removeImg(${i})">×</button>`;
                previewPane.appendChild(div);
            });
        }

        function removeImg(i) {
            selectedImages.splice(i, 1);
            renderPreviews();
            sendBtn.disabled = chatInput.value.trim() === "" && selectedImages.length === 0;
        }

        // Messaging
        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text && selectedImages.length === 0) return;

            document.getElementById('welcomeScreen').style.display = 'none';
            addMessage(text || "Images sent for analysis", 'user');

            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendBtn.disabled = true;

            const aiBox = addMessage("", 'ai', true);
            await callGroq(text, aiBox);
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

        function addMessage(text, role, loading = false) {
            const wrap = document.createElement('div');
            wrap.className = `msg-wrapper ${role === 'ai' ? 'msg-ai' : ''}`;

            const avatar = `<div class="avatar-icon bg-${role}">${role === 'user' ? '<i class="fas fa-user"></i>' : '<img src="../Logo/shaifly_ai_avatar.png" alt="AI">'}</div>`;
            const content = `<div class="msg-content w-100">${loading ? '<div class="spinner-grow spinner-grow-sm text-success"></div> <span class="small text-muted">Analyzing...</span>' : formatContent(text)}</div>`;

            wrap.innerHTML = avatar + content;
            chatBody.appendChild(wrap);
            chatBody.scrollTop = chatBody.scrollHeight;
            return wrap.querySelector('.msg-content');
        }

        function formatContent(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\[IMPORTANT\]/g, '<span class="important-tag">IMPORTANT</span>')
                .replace(/\[CRITICAL\]/g, '<span class="critical-tag">CRITICAL</span>');
        }

        async function typeMessage(text, container) {
            const formatted = formatContent(text).replace(/\n/g, '<br>');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = formatted;

            const nodes = Array.from(tempDiv.childNodes);
            container.innerHTML = '';

            for (const node of nodes) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const textContent = node.textContent;
                    const textNode = document.createTextNode("");
                    container.appendChild(textNode);

                    for (let i = 0; i < textContent.length; i++) {
                        textNode.textContent += textContent[i];
                        await new Promise(r => setTimeout(r, 7)); // Faster and smoother
                        chatBody.scrollTop = chatBody.scrollHeight;
                    }
                } else {
                    const clone = node.cloneNode(true);
                    container.appendChild(clone);
                    await new Promise(r => setTimeout(r, 20));
                    chatBody.scrollTop = chatBody.scrollHeight;
                }
            }
        }

        async function callGroq(prompt, output) {
            const key = window.APP_CONFIG?.GROQ_API_KEY || localStorage.getItem('GROQ_KEY');
            if (!key) { output.innerHTML = "API Key not found. Go to 'API Configuration' in sidebar."; return; }

            try {
                const res = await fetch("https://corsproxy.io/?" + encodeURIComponent("https://api.groq.com/openai/v1/chat/completions"), {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [...chatHistory, { role: "user", content: prompt + (selectedImages.length ? " (User provided images)" : "") }]
                    })
                });

                const data = await res.json();
                const aiMsg = data.choices[0].message.content;
                chatHistory.push({ role: "assistant", content: aiMsg });

                // Clear loading spinner and start typing
                output.innerHTML = "";
                await typeMessage(aiMsg, output);

                // Add to history sidebar
                const hist = document.getElementById('historyList');
                const hItem = document.createElement('a');
                hItem.className = 'history-item';
                hItem.innerHTML = `<i class="far fa-message me-2 small"></i> ${prompt.substring(0, 25) || "Image Analysis"}...`;
                hist.prepend(hItem);

                // Clear images
                selectedImages = [];
                renderPreviews();

            } catch (err) {
                output.innerHTML = "Network/API Connection Error.";
            }
        }

        function manageApiKey() {
            const key = prompt("Enter Groq API Key:", localStorage.getItem('GROQ_KEY') || "");
            if (key) localStorage.setItem('GROQ_KEY', key);
        }
    </script>
</body>

</html>
